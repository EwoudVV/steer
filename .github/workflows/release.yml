name: release

# Builds steer for every system when a version tag (v1.2.3) is pushed, and puts the
# files on the GitHub release. The install scripts download them from there.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, name: steer-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: steer-macos-x64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: steer-linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: steer-linux-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: steer-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    env:
      # Linux builds use musl so they run on old distros too.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: |
          src=target/${{ matrix.target }}/release/steer
          if [ -f "$src.exe" ]; then src="$src.exe"; fi
          cp "$src" "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Every file gets a .sig that steer update checks against the key built into steer
      # before it installs it. Without the secret this fails, instead of putting out a
      # release nobody's steer would install.
      - env:
          STEER_SIGNING_KEY: ${{ secrets.STEER_SIGNING_KEY }}
        run: node repo/tools/sign-release.mjs "${GITHUB_REF_NAME#v}" dist/*
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "install: curl -fsSL https://steer.duck.hackclub.app/install.sh | sh (mac, linux) or irm https://steer.duck.hackclub.app/install.ps1 | iex (windows)" \
          || gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
